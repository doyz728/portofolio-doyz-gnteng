<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - G-DEV</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">G-DEV</div>
        <button class="mobile-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul id="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="contact" class="perspective-container">
        <h2 class="section-title">Contact <span>Me</span></h2>
        <!-- Contact Floating Elements -->
        <div class="contact-floater contact-floater-1 float-3d"></div>
        <div class="contact-floater contact-floater-2 float-3d"></div>
        <div class="contact-floater contact-floater-3 float-3d"></div>
        <div class="contact-container animate-on-scroll">
            <div class="contact-info card-3d">
                <h3>Get In Touch</h3>
                <p>I'm always open to discussing new opportunities and interesting projects. Let's create something amazing together!</p>
                <div class="contact-details">
                    <div class="contact-item glow-3d">
                        <i class="fas fa-envelope"></i>
                        <span>G-DEV@gmail.com</span>
                    </div>
                    <div class="contact-item glow-3d">
                        <i class="fas fa-phone"></i>
                        <span>+62 123 456 789</span>
                    </div>
                    <div class="contact-item glow-3d">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Jakarta, Indonesia</span>
                    </div>
                </div>
            </div>
            <form id="contactForm" onsubmit="return validateForm(event)" class="contact-form-3d">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Nama Lengkap" required class="form-input-3d">
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address" required class="form-input-3d">
                </div>
                <div class="form-group">
                    <textarea id="message" rows="5" placeholder="Pesan Anda" required class="form-input-3d"></textarea>
                </div>
                <button type="submit" class="submit-btn glow-3d">Kirim Pesan <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </section>


    <footer>
        <p>&copy; 2026 G-DEV. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
